
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your Accessible World account.">
    <title>Create Account | Accessible World</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="register-page">

   ```html
<header class="navbar">
    <a href="index.html" class="logo">
        <span class="logo-icon">A</span>
        <span>Accessible<span class="logo-highlight">World</span></span>
    </a>

    <div class="nav-links">
        <a href="login.html">Login</a>
        <a href="index.html" class="nav-button">
            Back to Home ←
        </a>
    </div>
</header>
```

    <main class="register-main">

        <section class="register-card">

            <div class="register-icon">♿</div>

            <span class="eyebrow">JOIN OUR COMMUNITY</span>

            <h1>Create your account</h1>

            <p class="register-description">
                Join Accessible World and discover places
                without barriers.
            </p>

            <form id="registerForm">

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input
                        type="text"
                        id="fullName"
                        name="full_name"
                        placeholder="Enter your full name"
                        maxlength="100"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        maxlength="150"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="8"
                        maxlength="128"
                        autocomplete="new-password"
                        required
                    >
                    <small>At least 8 characters, including a letter and a number.</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Enter your password again"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <p id="registerMessage"
                   class="register-message"
                   role="status"
                   aria-live="polite"></p>

                <button type="submit"
                        id="registerButton"
                        class="register-submit">
                    Create Account →
                </button>

            </form>

            <p class="register-footer">
                Already have an account?
                <a href="#" id="loginLink">Login</a>
            </p>

        </section>

    </main>

    <footer class="register-bottom">
        © 2026 Accessible World. All rights reserved.
    </footer>

    <script src="js/register.js"></script>

</body>
</html>
